connector: files
description: Files in allowed folders
version: "3"
runtime: wasm
capabilities:
  files: ["${setting:roots}/**"]
limits: { memory_mb: 64, timeout_s: 30 }
actions:
  - name: read
    class: read
    description: Read a text file
    args:
      - { name: path, type: string, required: true, format: path, description: "absolute path or ~/…" }
    example: gate4ai files read --path ~/Documents/obsidian/inbox.md
  - name: list
    class: read
    description: List a directory
    args:
      - { name: path, type: string, required: true, format: path, description: "absolute path or ~/…" }
  - name: append
    class: write
    verify: read_back
    evidence: json
    description: Append text to the end of a file (never overwrites)
    args:
      - { name: path, type: string, required: true, format: path, description: "absolute path or ~/…" }
      - { name: text, type: string, required: true }
    example: 'gate4ai files append --path ~/Documents/obsidian/log.md --text "- done"'
  - name: write
    class: write
    verify: read_back
    evidence: json
    description: Create or overwrite a file (needs approval by default)
    args:
      - { name: path, type: string, required: true, format: path, description: "absolute path or ~/…" }
      - { name: content, type: string, required: true }
